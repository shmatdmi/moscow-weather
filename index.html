<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#77acd2">
  <title>Погода в России</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #193140;
      --muted: #536d79;
      --glass: rgba(238, 246, 239, 0.74);
      --glass-strong: rgba(248, 251, 246, 0.86);
      --line: rgba(255, 255, 255, 0.68);
      --shadow: 0 22px 55px rgba(29, 64, 75, 0.24);
      --accent: #467c69;
      --error: #8e352f;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(52, 119, 164, 0.06), rgba(47, 93, 56, 0.18)),
        url("serene-hills.png") center / cover fixed;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
      padding: 52px 0 36px;
    }

    .hero {
      margin: 0 auto 30px;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 16px rgba(28, 69, 91, 0.42);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .hero__text {
      max-width: 610px;
      margin: 14px auto 0;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.55;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .weather-card {
      min-width: 0;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(17px) saturate(115%);
      -webkit-backdrop-filter: blur(17px) saturate(115%);
    }

    .weather-card:nth-child(2) { background: rgba(233, 243, 235, 0.78); }
    .weather-card:nth-child(3) { background: rgba(230, 241, 238, 0.77); }

    .card__header,
    .card__footer,
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .city {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -0.025em;
    }

    .live {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(70, 124, 105, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.46);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .description {
      min-height: 22px;
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .temperature {
      margin: 0 0 22px;
      font-size: clamp(52px, 6vw, 72px);
      font-weight: 650;
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .temperature__unit {
      margin-left: 3px;
      color: var(--muted);
      font-size: 24px;
      font-weight: 500;
      vertical-align: top;
      letter-spacing: -0.02em;
    }

    .metric-row {
      padding: 14px 0;
      border-top: 1px solid rgba(25, 49, 64, 0.1);
    }

    .metric-label { color: var(--muted); font-size: 13px; }
    .metric-value { font-size: 15px; font-weight: 750; }

    .card__footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .error {
      display: none;
      margin: 18px 0 0;
      padding: 12px 16px;
      border: 1px solid rgba(142, 53, 47, 0.16);
      border-radius: 14px;
      background: rgba(255, 239, 237, 0.87);
      color: var(--error);
      font-size: 13px;
      line-height: 1.4;
    }

    .error.is-visible { display: block; }

    footer {
      padding: 18px 20px 24px;
      color: rgba(255, 255, 255, 0.94);
      font-size: 13px;
      text-align: center;
      text-shadow: 0 1px 8px rgba(16, 53, 43, 0.55);
    }

    @media (max-width: 880px) {
      body { background-attachment: scroll; }
      .page { width: min(680px, calc(100% - 32px)); padding-top: 38px; }
      .weather-grid { grid-template-columns: 1fr; }
      .weather-card { padding: 22px; }
      .temperature { font-size: 58px; }
    }

    @media (max-width: 420px) {
      .page { width: calc(100% - 24px); padding-top: 28px; }
      .hero { margin-bottom: 22px; }
      .weather-card { border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Погода сейчас</p>
    </header>

    <section class="weather-grid" id="weatherGrid" aria-label="Погода в Москве, Туле и Сочи"></section>
    <p class="error" id="globalError" role="status"></p>
  </main>

  <footer>Все права защищены. 2026</footer>

  <template id="weatherCardTemplate">
    <article class="weather-card">
      <header class="card__header">
        <h2 class="city"></h2>
        <span class="live">Live</span>
      </header>
      <p class="description">Загрузка данных…</p>
      <p class="temperature"><span class="temperature__value">--</span><span class="temperature__unit">°C</span></p>
      <div class="metric-row">
        <span class="metric-label">Скорость ветра</span>
        <span class="metric-value"><span class="wind">--</span> м/с</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Ощущается как</span>
        <span class="metric-value"><span class="feels-like">--</span> °C</span>
      </div>
      <div class="card__footer">
        <span>Обновление каждую минуту</span>
        <time class="updated">--:--</time>
      </div>
    </article>
  </template>

  <script>
    const apiToken = 'ba23e3e7888484e7a26b57b215d65200';
    const cities = [
      { name: 'Москва', query: 'Moscow,RU' },
      { name: 'Тула', query: 'Tula,RU' },
      { name: 'Сочи', query: 'Sochi,RU' }
    ];
    const updateIntervalMs = 60 * 1000;
    const grid = document.getElementById('weatherGrid');
    const template = document.getElementById('weatherCardTemplate');
    const globalError = document.getElementById('globalError');

    const cards = new Map();

    function formatNumber(value) {
      return Number.isFinite(value)
        ? new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 }).format(value)
        : '--';
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat('ru-RU', {
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    function capitalize(text) {
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Данные получены';
    }

    function createCards() {
      cities.forEach((city) => {
        const card = template.content.firstElementChild.cloneNode(true);
        card.querySelector('.city').textContent = city.name;
        grid.append(card);
        cards.set(city.query, card);
      });
    }

    function renderCity(city, data) {
      const card = cards.get(city.query);
      card.querySelector('.description').textContent = capitalize(data.weather?.[0]?.description);
      card.querySelector('.temperature__value').textContent = formatNumber(data.main?.temp);
      card.querySelector('.wind').textContent = formatNumber(data.wind?.speed);
      card.querySelector('.feels-like').textContent = formatNumber(data.main?.feels_like);
      card.querySelector('.updated').textContent = formatTime(new Date());
      card.querySelector('.live').textContent = 'Live';
    }

    function showCityError(city) {
      const card = cards.get(city.query);
      card.querySelector('.description').textContent = 'Не удалось обновить данные';
      card.querySelector('.live').textContent = 'Нет связи';
    }

    async function loadCity(city) {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city.query)}&appid=${apiToken}&units=metric&lang=ru`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${city.name}: ${response.status}`);
      renderCity(city, await response.json());
    }

    async function loadWeather() {
      globalError.classList.remove('is-visible');
      const results = await Promise.allSettled(cities.map(loadCity));
      const failed = results
        .map((result, index) => ({ result, city: cities[index] }))
        .filter(({ result }) => result.status === 'rejected');

      failed.forEach(({ city }) => showCityError(city));
      if (failed.length) {
        globalError.textContent = `Не удалось получить свежие данные: ${failed.map(({ city }) => city.name).join(', ')}. Повторим попытку через минуту.`;
        globalError.classList.add('is-visible');
      }
    }

    createCards();
    loadWeather();
    setInterval(loadWeather, updateIntervalMs);
  </script>
</body>
</html>
